# PostgreSQL.
#
#   Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { ENV["USER"] } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { nil } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: salary_manager_acme_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: salary_manager_acme_test

production:
  primary:
    <<: *default
    database: salary_manager_acme_production
    username: salary_manager_acme
    password: <%= ENV["SALARY_MANAGER_ACME_DATABASE_PASSWORD"] %>
  cache:
    <<: *default
    database: salary_manager_acme_production_cache
    migrations_paths: db/cache_migrate
    username: salary_manager_acme
    password: <%= ENV["SALARY_MANAGER_ACME_DATABASE_PASSWORD"] %>
  queue:
    <<: *default
    database: salary_manager_acme_production_queue
    migrations_paths: db/queue_migrate
    username: salary_manager_acme
    password: <%= ENV["SALARY_MANAGER_ACME_DATABASE_PASSWORD"] %>
  cable:
    <<: *default
    database: salary_manager_acme_production_cable
    migrations_paths: db/cable_migrate
    username: salary_manager_acme
    password: <%= ENV["SALARY_MANAGER_ACME_DATABASE_PASSWORD"] %>
